<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="40" y1="40" x2="216" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="60" y1="180" x2="200" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.14)" stroke-width="2.5" />
  
  <!-- Subtle Internal Glow Ring -->
  <rect x="14" y="14" width="228" height="228" rx="52" fill="none" stroke="url(#glowGrad)" stroke-width="1.5" />

  <!-- Background Ambient Glow -->
  <circle cx="128" cy="128" r="54" fill="#6366F1" opacity="0.18" filter="url(#subtleGlow)" />

  <!-- Main Symbol: Geometric Pulse Cut (Vertical Video + Dynamic Slash + Play Triangle) -->
  <!-- Left Vertical Ribbon (Vertical Video aspect) -->
  <path d="M68 76C68 64.9543 76.9543 56 88 56H98C104.627 56 110 61.3726 110 68V188C110 194.627 104.627 200 98 200H88C76.9543 200 68 191.046 68 180V76Z" 
        fill="url(#primaryGrad)" />

  <!-- Diagonal Dynamic Laser Cut / Pulse Wave -->
  <path d="M96 60L186 150C190.5 154.5 188 162 181.5 162H150L86 98C81.5 93.5 84 86 90.5 86L96 60Z" 
        fill="url(#accentGrad)" opacity="0.9" />

  <!-- Precision Play / Diamond Peak -->
  <path d="M128 88L184 124C190.667 128.2 190.667 137.8 184 142L142 168C134 173 124 167 124 157V98C124 90.5 132 85.5 138 89.5L128 88Z" 
        fill="#FFFFFF" filter="url(#subtleGlow)" />

  <!-- Small Futuristic Tech Dot Matrix -->
  <circle cx="178" cy="74" r="5" fill="#38BDF8" />
  <circle cx="196" cy="74" r="3.5" fill="#818CF8" opacity="0.7" />
  <circle cx="178" cy="92" r="3.5" fill="#C084FC" opacity="0.7" />
</svg>
